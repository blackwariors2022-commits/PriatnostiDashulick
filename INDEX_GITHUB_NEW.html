<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Для тебя 💗</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(145deg,#fff7f8,#f8e9ee);
color:#5c424b;
overflow:hidden;
}

#app{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
}

.card{
width:min(100%,560px);
height:calc(100vh - 30px);
background:#fffafa;
border-radius:30px;
padding:55px 25px 30px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
box-shadow:0 15px 50px rgba(100,60,75,.15);
position:relative;
overflow:auto;
}

.page{
position:absolute;
top:17px;
font-size:13px;
color:#b59aa3;
}

h1{
font-size:26px;
font-weight:500;
line-height:1.4;
margin:0 0 25px;
max-width:480px;
}

button{
border:0;
background:#f3d7df;
color:#5c424b;
font-size:17px;
padding:14px 32px;
border-radius:50px;
cursor:pointer;
box-shadow:0 7px 20px rgba(170,110,130,.15);
}

button:active{
transform:scale(.96);
}

img,video{
max-width:90%;
max-height:52vh;
border-radius:18px;
object-fit:contain;
box-shadow:0 8px 25px rgba(90,60,70,.12);
}

.polaroid{
padding:14px 14px 40px;
background:white;
border-radius:2px;
}

.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
width:100%;
max-width:500px;
}

.photo{
background:white;
padding:8px;
border-radius:8px;
box-shadow:0 5px 15px rgba(70,50,60,.1);
}

.photo img{
width:100%;
height:170px;
object-fit:cover;
border-radius:4px;
box-shadow:none;
}

.caption{
font-size:13px;
line-height:1.3;
margin-top:7px;
}

.effects{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:100;
}

.effect{
position:absolute;
font-size:32px;
animation:fall 2.7s forwards;
}

@keyframes fall{
0%{
transform:translateY(0) scale(.7) rotate(0);
opacity:0;
}
15%{
opacity:1;
}
100%{
transform:translateY(90vh) scale(1.2) rotate(260deg);
opacity:0;
}
}

.hidden{
opacity:0;
transform:scale(.8);
transition:.5s;
}

.hidden.show{
opacity:1;
transform:scale(1);
}

@media(max-height:700px){
h1{
font-size:22px;
}

img,video{
max-height:43vh;
}
}
</style>
</head>

<body>

<div id="app"></div>
<div class="effects" id="effects"></div>

<script>

const A="assets/";

const pages=[

{
type:"intro",
title:"Для тебя 💗",
button:"Открыть открытку"
},

{
type:"video",
title:"Я хочу кое-что тебе сказать…",
video:"video1.mp4"
},

{
type:"photo",
title:"♡",
image:"IMG_9728.png",
button:"Дальше ♡"
},

{
type:"photo",
title:"Ты знаешь, что я люблю делать тебя счастливой, такой как на прошлом фото?",
image:"IMG_9735.jpeg",
button:"ДА"
},

{
type:"gallery",
items:[
["IMG_9728.png","Ты была счастлива рядом со мной ♡"],
["IMG_9731.png","Ты была счастлива, когда мы были вместе ♡"],
["IMG_9734.jpeg","Ты была радостной, когда ела креветки ♡"],
["IMG_9732.jpeg","Была счастлива, когда включала свою музыку в машине ♡"]
]
},

{
type:"videoButton",
title:"Так ведь?",
video:"video3.mp4",
button:"ДА",
effect:"💋"
},

{
type:"video",
title:"Хотел, чтобы ты это увидела вчера, в мое отсутствие, но как всегда сюрприз не удался",
video:"video2.mp4"
},

{
type:"photo",
title:"Люблю поднимать тебе настроение и делать его игривым как на этом фото.",
image:"IMG_9744.jpeg",
button:"Дальше ♡"
},

{
type:"video",
title:"На всех этих фотках, конечно ты счастлива, но тебе не хватало кое чего,открой свой ящик в столе.",
video:"video3.mp4"
},

{
type:"videoButton",
title:"",
video:"video3.mp4",
button:"НАДО",
effect:"🍬"
},

{
type:"princess",
title:"Помни, что ты…",
image:"IMG_9729.jpeg"
},

{
type:"button",
title:"надеюсь получилось удивить тебя и сделать твой день чуточку прекраснее?",
button:"КОНЕЧНО",
effect:"❤️"
},

{
type:"final",
title:"получилось?",
video:"video1.mp4",
text:"Тебя ещё ждут там записочки, открывай шкафчик, там приятности и ещё записочки 💌"
}

];

let current=0;

function effects(symbol){

for(let i=0;i<25;i++){

const e=document.createElement("div");

e.className="effect";

e.innerText=symbol;

e.style.left=(Math.random()*95)+"%";
e.style.top=(Math.random()*20)+"%";
e.style.animationDelay=(Math.random()*0.7)+"s";

document.getElementById("effects").appendChild(e);

setTimeout(()=>{
e.remove();
},3500);

}

}

function next(){

if(current<pages.length-1){

current++;

render();

}

}

function render(){

const p=pages[current];

let html="";

if(p.type==="intro"){

html=`
<h1>${p.title}</h1>
<button onclick="next()">${p.button}</button>
`;

}

else if(p.type==="video"){

html=`
<h1>${p.title}</h1>
<video src="${A+p.video}" autoplay muted loop playsinline></video>
<br><br>
<button onclick="next()">Дальше ♡</button>
`;

}

else if(p.type==="photo"){

html=`
<h1>${p.title}</h1>
<img class="polaroid" src="${A+p.image}">
<br><br>
<button onclick="next()">${p.button}</button>
`;

}

else if(p.type==="gallery"){

html=`
<h1>♡</h1>

<div class="gallery">

${p.items.map(x=>`

<div class="photo">

<img src="${A+x[0]}">

<div class="caption">
${x[1]}
</div>

</div>

`).join("")}

</div>

<br>

<button onclick="next()">Дальше ♡</button>
`;

}

else if(p.type==="videoButton"){

html=`

${p.title?`<h1>${p.title}</h1>`:""}

<video src="${A+p.video}" autoplay muted loop playsinline></video>

<br><br>

<button onclick="effects('${p.effect}');setTimeout(next,900)">
${p.button}
</button>

`;

}

else if(p.type==="princess"){

html=`

<h1>${p.title}</h1>

<img src="${A+p.image}">

<br><br>

<button onclick="document.getElementById('secret').classList.add('show')">
Нажми ♡
</button>

<h2 id="secret" class="hidden">
маленькая принцесса ♡
</h2>

<br>

<button onclick="next()">
Дальше ♡
</button>

`;

}

else if(p.type==="button"){

html=`

<h1>${p.title}</h1>

<button onclick="effects('${p.effect}');setTimeout(next,900)">
${p.button}
</button>

`;

}

else if(p.type==="final"){

html=`

<h1>${p.title}</h1>

<video src="${A+p.video}" autoplay muted loop playsinline></video>

<p>
${p.text}
</p>

`;

}

document.getElementById("app").innerHTML=`

<div class="card">

<div class="page">
${current+1} / ${pages.length}
</div>

${html}

</div>

`;

}

render();

</script>

</body>
</html>
